[package]
name = "rust_audio_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_audio_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "usb_enum"
path = "src/bin/usb_enum.rs"
required-features = []

[[bin]]
name = "play_test"
path = "src/bin/play_test.rs"
required-features = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug-assertions = false
overflow-checks = false

[build-dependencies]
pkg-config = "0.3"
cc = "1"

[dependencies]
gstreamer = "0.23"
gstreamer-base = "0.23"
glib = "0.20"
libc = "0.2"
rustfft = "6"
rusb = "0.9"
libusb1-sys = "0.7"
crossbeam-channel = "0.5"
quick-xml = "0.38"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4"] }
isahc = { version = "1.8", default-features = false, features = ["http2"] }
http = "0.2"
